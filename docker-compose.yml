version: '3.8'

services:
  # Servicio 1: La Base de Datos PostgreSQL
  db:
    image: postgres:15
    container_name: hackathon_db
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=user
      - POSTGRES_DB=hackathon_db
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data

  # Servicio 2: Tu entorno de Python para ingesta y análisis
  python_app:
    build: . # Busca el archivo 'Dockerfile' en la carpeta actual
    container_name: python_app
    depends_on:
      - db # Espera a que la base de datos esté lista
    volumes:
      - .:/app # Sincroniza tus códigos de la compu con el contenedor
    tty: true # Mantiene el contenedor encendido
    stdin_open: true
    environment:
      - DB_HOST=db
      - DB_NAME=hackathon_db
      - DB_USER=User
      - DB_PASS=User

# Definición del espacio de almacenamiento para la DB
volumes:
  pgdata: